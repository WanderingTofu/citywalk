name: Bake map tiles

# Fetches each district's OpenStreetMap data once and commits it as static tiles,
# so the deployed app loads city plans from its own host. Run it by hand from the
# Actions tab; it is also refreshed on the first of each month.
on:
  workflow_dispatch:
    inputs:
      radius:
        description: Tiles to bake in each direction from the spawn point (1 tile = 800 m)
        default: '2'
      city:
        description: City id to bake (blank = all)
        default: ''
      force:
        description: Re-fetch tiles that already exist
        type: boolean
        default: false
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One city at a time, committing after each: progress shows up on the site as it
      # happens, and a slow or failed city never costs the ones already done.
      - name: Bake and commit, city by city
        env:
          RADIUS: ${{ inputs.radius || '2' }}
          ONLY: ${{ inputs.city }}
          FORCE: ${{ (inputs.force || github.event_name == 'schedule') && '--force' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cities="${ONLY:-tokyo kyoto paris new-york los-angeles bangkok chicago}"
          for city in $cities; do
            echo "::group::$city"
            npm run bake -- --city "$city" --radius "$RADIUS" $FORCE || echo "::warning::nothing baked for $city"
            echo "::endgroup::"
            git add public/tiles
            if git diff --cached --quiet; then
              echo "No tile changes for $city."
            else
              git commit -q -m "Bake map tiles: $city ($(date -u +%Y-%m-%d))"
              git pull -q --rebase origin main
              git push -q
              echo "Committed $city."
            fi
          done
