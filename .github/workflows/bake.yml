name: Bake map tiles

# Fetches each district's OpenStreetMap data once and commits it as static tiles,
# so the deployed app loads city plans from its own host. Run it by hand from the
# Actions tab; it is also refreshed on the first of each month.
on:
  workflow_dispatch:
    inputs:
      radius:
        description: Tiles to bake in each direction from the spawn point (1 tile = 800 m)
        default: '2'
      city:
        description: City id to bake (blank = all)
        default: ''
      force:
        description: Re-fetch tiles that already exist
        type: boolean
        default: false
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A few tiles at a time, committing after each batch: progress shows up on the site
      # as it happens, an interrupted run loses at most one batch, and the next run
      # carries on from wherever this one stopped.
      - name: Bake and commit in small batches
        env:
          RADIUS: ${{ inputs.radius || '2' }}
          ONLY: ${{ inputs.city }}
          FORCE: ${{ (inputs.force || github.event_name == 'schedule') && '--force' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add public/tiles
            if ! git diff --cached --quiet; then
              git commit -q -m "Bake map tiles: $1 ($(date -u +%Y-%m-%d))"
              git pull -q --rebase origin main
              git push -q
              echo "Saved $1."
            fi
          }
          cities="${ONLY:-tokyo kyoto paris new-york los-angeles bangkok chicago}"
          for city in $cities; do
            echo "::group::$city"
            # --force applies to the first batch only; later batches fill in what is missing.
            flags="$FORCE"
            for batch in $(seq 1 12); do
              status=0
              npm run --silent bake -- --city "$city" --radius "$RADIUS" --max 3 $flags || status=$?
              flags=""
              save "$city"
              # 10 = stopped at the batch limit with tiles still to do; anything else ends this city.
              [ "$status" -eq 10 ] || break
            done
            echo "::endgroup::"
          done
